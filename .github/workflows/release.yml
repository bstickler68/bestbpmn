name: Release

# Ein auf GitHub veröffentlichtes Release (z. B. Tag v0.2.0) bekommt die Auslieferung angehängt:
# bestbpmn.html zum direkten Herunterladen und das ZIP mit Web-App und Kurzanleitung.
# Von Hand gestartet, gibt es das ZIP nur als Artefakt des Laufs.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Auslieferung bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/release.mjs
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        with:
          name: bestbpmn
          path: apps/web/dist/release/*.zip
      - name: Dateien an das Release hängen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" apps/web/dist/release/*.zip apps/web/dist/single/bestbpmn.html --clobber
